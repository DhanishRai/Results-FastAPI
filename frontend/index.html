<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #1e3a8a, transparent 35%),
                radial-gradient(circle at bottom right, #581c87, transparent 35%),
                #080b14;

            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }


        .container {
            width: 100%;
            max-width: 850px;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-radius: 24px;

            padding: 45px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.5);

            animation: fadeIn 0.7s ease;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* HEADER */

        h1 {
            text-align: center;

            font-size: 34px;

            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa,
                #c084fc
            );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .subtitle {
            text-align: center;

            color: #9ca3af;

            margin-bottom: 35px;

            font-size: 15px;
        }


        /* SEARCH BOX */

        .search-box {

            display: flex;

            gap: 12px;

            margin-bottom: 35px;

        }


        input {

            flex: 1;

            padding: 15px 18px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.15);

            background: rgba(0,0,0,0.25);

            color: white;

            font-size: 16px;

            outline: none;

            transition: 0.3s;

        }


        input::placeholder {
            color: #6b7280;
        }


        input:focus {

            border-color: #60a5fa;

            box-shadow:
                0 0 0 3px rgba(96,165,250,0.15);

        }


        button {

            padding: 15px 25px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 25px rgba(37,99,235,0.3);

        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(124,58,237,0.45);

        }


        button:active {

            transform: scale(0.97);

        }


        /* RESULT CARD */

        .student-card {

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 18px;

            padding: 30px;

            animation: resultAppear 0.5s ease;

        }


        @keyframes resultAppear {

            from {

                opacity: 0;
                transform: scale(0.97);

            }

            to {

                opacity: 1;
                transform: scale(1);

            }

        }


        .student-card h2 {

            font-size: 26px;

            margin-bottom: 20px;

            color: #f9fafb;

        }


        .student-info {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

            margin-bottom: 25px;

        }


        .info-box {

            background: rgba(0,0,0,0.2);

            padding: 15px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.08);

        }


        .info-label {

            display: block;

            font-size: 12px;

            color: #9ca3af;

            margin-bottom: 5px;

            text-transform: uppercase;

            letter-spacing: 0.8px;

        }


        .info-value {

            font-size: 16px;

            font-weight: 600;

            color: #e5e7eb;

        }


        /* TABLE */

        table {

            width: 100%;

            border-collapse: separate;

            border-spacing: 0;

            overflow: hidden;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.1);

        }


        th {

            background: rgba(37,99,235,0.25);

            color: #bfdbfe;

            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 0.6px;

        }


        th,
        td {

            padding: 14px 16px;

            text-align: left;

            border-bottom: 1px solid rgba(255,255,255,0.08);

        }


        td {

            color: #d1d5db;

            background: rgba(255,255,255,0.02);

        }


        tr:last-child td {

            border-bottom: none;

        }


        tr:hover td {

            background: rgba(255,255,255,0.06);

        }


        /* GRADE */

        td:last-child {

            font-weight: 700;

            color: #60a5fa;

        }


        /* NOT FOUND */

        .not-found {

            text-align: center;

            padding: 25px;

            border-radius: 15px;

            background: rgba(239,68,68,0.08);

            border: 1px solid rgba(239,68,68,0.25);

            color: #f87171;

            animation: fadeIn 0.4s ease;

        }


        /* FOOTER */

        .footer {

            text-align: center;

            margin-top: 30px;

            color: #6b7280;

            font-size: 12px;

        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }


            .container {

                padding: 25px 20px;

                border-radius: 18px;

            }


            h1 {

                font-size: 27px;

            }


            .search-box {

                flex-direction: column;

            }


            button {

                width: 100%;

            }


            .student-info {

                grid-template-columns: 1fr;

            }


            .student-card {

                padding: 20px;

            }


            th,
            td {

                padding: 11px 10px;

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>🎓 Student Result Portal</h1>

        <p class="subtitle">
            Search and view student academic results
        </p>


        <div class="search-box">

            <input
                type="text"
                id="register_number"
                placeholder="Enter Register Number"
            >

            <button onclick="searchResult()">
                Search Result
            </button>

        </div>


        <div id="result"></div>


        <div class="footer">
            Student Result Management System • 2026
        </div>

    </div>


    <script>

        async function searchResult() {

            let registerNumber =
                document.getElementById(
                    "register_number"
                ).value.trim();


            if (!registerNumber) {

                document.getElementById("result").innerHTML =
                    '<div class="not-found">Please enter a register number.</div>';

                return;
            }


            document.getElementById("result").innerHTML =
                '<div style="text-align:center;color:#9ca3af;padding:20px;">Searching...</div>';


            try {

                let response =
                    await fetch(
                        "https://dhanishrai-results-fastapi.onrender.com/results"
                    );


                let students =
                    await response.json();


                let student =
                    students.find(
                        student =>
                            student.register_number === registerNumber
                    );


                if (student) {


                    let output = `

                        <div class="student-card">

                            <h2>
                                ${student.student_name}
                            </h2>


                            <div class="student-info">

                                <div class="info-box">

                                    <span class="info-label">
                                        Register Number
                                    </span>

                                    <span class="info-value">
                                        ${student.register_number}
                                    </span>

                                </div>


                                <div class="info-box">

                                    <span class="info-label">
                                        Department
                                    </span>

                                    <span class="info-value">
                                        ${student.department}
                                    </span>

                                </div>

                            </div>


                            <table>

                                <tr>

                                    <th>
                                        Subject
                                    </th>

                                    <th>
                                        Grade
                                    </th>

                                </tr>

                    `;


                    student.subjects.forEach(subject => {

                        output += `

                            <tr>

                                <td>
                                    ${subject.subject_name}
                                </td>

                                <td>
                                    ${subject.grade}
                                </td>

                            </tr>

                        `;

                    });


                    output += `

                            </table>

                        </div>

                    `;


                    document.getElementById("result").innerHTML =
                        output;


                } else {

                    document.getElementById("result").innerHTML =
                        '<div class="not-found">Student Not Found</div>';

                }


            } catch (error) {

                document.getElementById("result").innerHTML =
                    '<div class="not-found">Unable to connect to the result server.</div>';

                console.error(error);

            }

        }


        // Press Enter to search

        document
            .getElementById("register_number")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    searchResult();
                    
                }

            });

    </script>


</body>

</html>
